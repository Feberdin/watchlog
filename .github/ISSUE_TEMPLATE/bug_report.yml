name: Bug report
description: Report a reproducible WatchLog problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not paste secrets, API keys, cookies, or private logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact steps needed to reproduce.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      placeholder: fd169522...
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Unraid
        - Unraid Deployment Broker
        - Local development
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets, cookies, IPs if needed, and private media names before posting.
      render: shell
