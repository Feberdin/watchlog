# Purpose: Verify every WatchLog change before it can become a deployable GitOps commit.
# Input/Output: Repository source becomes code checks and a production container image build.
# Invariants: Third-party actions stay immutable; the workflow only reads repository contents.
# Debugging: Open the first failing step and reproduce its npm command from CONTRIBUTING.md.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, lint, test, app and image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Why this exists: the deploy target builds from the repository context.
      # CI catches missing ignore rules, Linux-only dependency errors, and image
      # assembly failures before a bounded Broker deployment is attempted.
      - name: Build production Docker image
        run: docker build --build-arg APP_COMMIT="${GITHUB_SHA}" --tag watchlog-ci:test .
